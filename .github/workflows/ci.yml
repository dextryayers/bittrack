name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (engine)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: src/engine
        run: cargo build --workspace
      - name: Test
        working-directory: src/engine
        run: cargo test --workspace

  dotnet:
    name: .NET (app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core
        run: dotnet build src/app/Veritas.Core/Veritas.Core.csproj
      - name: Build App
        run: dotnet build src/app/Veritas.App/Veritas.App.csproj
