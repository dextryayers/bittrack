[package]
name = "veritas-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "veritas_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
veritas-core = { path = "../veritas-core" }
veritas-models = { path = "../veritas-models" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }

# Local GGUF inference. Without this feature the engine refuses to produce a
# verdict instead of silently falling back to keyword heuristics.
llama-cpp-2 = { version = "0.1.160", optional = true }

[features]
default = ["llm"]
llm = ["dep:llama-cpp-2"]

[build-dependencies]
cbindgen = { workspace = true }
